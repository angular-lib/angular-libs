name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build demo for GitHub Pages
        run: bun run ng build demo --configuration=production --base-href=/${{ github.event.repository.name }}/

      # SPA fallback: refresh/deep links serve index.html
      - name: Add 404.html for client-side routing
        run: cp dist/demo/browser/index.html dist/demo/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/demo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
